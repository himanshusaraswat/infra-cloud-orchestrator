name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read
  pull-requests: read

jobs:
  commitlint:
    name: 'Lint Commit Messages (Conventional Commits)'
    runs-on: ubuntu-latest
    steps:
      - id: checkout
        name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - id: setupNode
        name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26

      - id: commitlint
        name: Validate PR / Push Commits
        uses: wagoid/commitlint-github-action@v6
        with:
          configFile: 'commitlint.config.mjs'

  ci:
    name: 'CI Quality Gates (Terraform Fmt, Init, Validate)'
    runs-on: ubuntu-latest
    needs: [commitlint]
    steps:
      - id: checkout
        name: Checkout Code
        uses: actions/checkout@v4

      - id: setupTerraform
        name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.11.1

      - id: setupNode
        name: Setup Node 26
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'

      - id: install
        name: Install Dependencies
        run: npm ci

      - id: formatCheck
        name: Check Code Formatting
        run: npm run format:check

      - id: terraformFmt
        name: Terraform Format Check
        run: terraform fmt -check -diff

      - id: terraformInit
        name: Terraform Init (Validation Mode)
        run: terraform init -backend=false

      - id: terraformValidate
        name: Terraform Validate
        run: terraform validate
